    description: OS detection scan against a host with one open and one closed port
    attack: true
    expected: [NA-001]
  - file: data/nmap/nmap_ACK_scan_on_port_80
    description: Single-port ACK scan; blind spot (no SYNs, one port)
    attack: true
    expected: []
  - file: data/nmap/nmap_ACK_scan_on_port_80_2
    description: Single-port ACK scan with fragmentation and spoofed source; blind spot
    attack: true
    expected: []
  - file: data/nmap/nmap_zombie_scan
    description: Idle scan via a zombie host; blind spot
    attack: true
    expected: []
  - file: data/synthetic/syn_flood.pcap
    description: SYNTHETIC - 300 spoofed sources send SYNs to one port and never complete
    attack: true
    expected: [NA-002]
  - file: data/synthetic/dns_tunnel.pcap
    description: SYNTHETIC - one host sends 40 random-looking 40-character subdomains to one parent domain
    attack: true
    expected: [NA-003]
  - file: data/synthetic/benign_busy_server.pcap
    description: SYNTHETIC - 300 clients connect to one web server and finish every handshake
    attack: false
    expected: []
  - file: data/synthetic/benign_dns.pcap
    description: SYNTHETIC - normal lookups, ISP-style hostnames, and reverse lookups
    attack: false
    expected: []